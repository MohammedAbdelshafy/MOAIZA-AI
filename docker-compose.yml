version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: moaiza-postgres
    environment:
      POSTGRES_USER: moaiza
      POSTGRES_PASSWORD: moaiza_dev_password
      POSTGRES_DB: moaiza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U moaiza']
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: moaiza-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@moaiza.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Redis for Caching (Optional)
  redis:
    image: redis:7-alpine
    container_name: moaiza-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Minio for S3-compatible storage (Optional)
  minio:
    image: minio/minio:latest
    container_name: moaiza-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: moaiza-network
